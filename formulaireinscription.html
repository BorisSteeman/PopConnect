<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
<title>Inscription</title>
</head>
<body>
<div id="form" class="form" > {{ error }}
<h2>Inscription</h2>
<form action="php/donneesinscription.php" method="post">
    <label for="firstname">Prénom :</label>
    <input type="text" id="firstname" name="firstname" placeholder="Entrez votre prénom" required>
    
    <label for="name">Nom :</label>
    <input type="text" id="name" name="name" placeholder="Entrez votre nom" required>
    
    <label for="phone">Numéro de téléphone :</label>
    <input type="tel" id="phone" name="phone" placeholder="Entrez votre numéro de téléphone" required>
    
    <label for="email">Email :</label>
    <input type="email" id="email" name="email" placeholder="Entrez votre email" required>
    
    <label for="password">Mot de passe :</label>
    <input type="password" id="password" name="password" placeholder="Entrez votre mot de passe" required>
    
    <label for="password_confirm">Confirmez le mot de passe :</label>
    <input type="password" id="password_confirm" name="password_confirm" placeholder="Confirmez votre mot de passe" required>
    
    <button type="submit">S'inscrire</button>
</form>
<p>Déjà inscrit ? <a href="formulairelogin.html">Se connecter</a></p>
</div>

<script>
const { createApp } = Vue
 
createApp({
    data() {
        return {
            error: ''
        }
    },
    async mounted() {
        let paramsString = new URL(window.location.href).searchParams;
        let searchParams = new URLSearchParams(paramsString);
        this.error = searchParams.has("msg") ? searchParams.get("msg") : '';
    }
}).mount('#form')
</script>
</body>
</html>
